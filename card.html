<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membership Card</title>

<style>
body{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  background: linear-gradient(135deg, #000, #8b0000);
  font-family: Arial;
  color:white;
}

.card{
  width:90%;
  max-width:340px;
  background: linear-gradient(145deg, #b30000, #000);
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 20px red;
  text-align:center;
  position:relative;
}

.profile{
  width:100px;
  height:100px;
  border-radius:50%;
  border:3px solid white;
  object-fit:cover;
}

.info{
  text-align:left;
  margin-top:15px;
  line-height:1.7;
}

.id{
  position:absolute;
  bottom:10px;
  right:10px;
  font-size:11px;
}

.bottom{
  position:absolute;
  bottom:10px;
  left:10px;
  font-size:11px;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="card">

<h2>UDANPIRAPPEY VA</h2>

<img id="photo" class="profile">

<div class="info">
<p><b>Name:</b> <span id="name"></span></p>
<p><b>District:</b> <span id="district"></span></p>
<p><b>Constituency:</b> <span id="constituency"></span></p>
</div>

<div class="id" id="id"></div>
<div class="bottom">Created by Ravin Tech</div>

</div>

<script>
document.getElementById("name").innerText = localStorage.getItem("name");
document.getElementById("district").innerText = localStorage.getItem("district");
document.getElementById("constituency").innerText = localStorage.getItem("constituency");
document.getElementById("id").innerText = localStorage.getItem("id");

const photo = localStorage.getItem("photo");

document.getElementById("photo").src =
photo && photo !== "" ? photo : "https://via.placeholder.com/100";
</script>

</body>
</html>
