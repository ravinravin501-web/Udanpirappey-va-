<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membership Card</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b0f1a;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
  color:white;
}

/* ===== FRONT CARD ===== */
.card-front{
  width:100%;
  max-width:360px;
  height:220px;
  background:#071424;
  border-radius:20px;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 20px rgba(255,0,0,0.4);
}

/* TOP LEFT LEADERS */
.leaders{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:5px;
}

.leaders img{
  width:40px;
  height:40px;
  border-radius:5px;
  object-fit:cover;
}

/* QR */
.qr{
  position:absolute;
  top:10px;
  right:10px;
}

.qr img{
  width:45px;
  height:45px;
}

/* LOGO CENTER */
.center-logo{
  text-align:center;
  margin-top:35px;
}

.center-logo img{
  width:70px;
}

/* TITLE */
.title{
  text-align:center;
  font-weight:bold;
  margin-top:5px;
  font-size:14px;
}

.subtitle{
  text-align:center;
  font-size:11px;
  opacity:0.8;
}

/* RED SHAPE */
.red-shape{
  width:120px;
  height:60px;
  background:red;
  border-radius:60px 60px 0 0;
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
}

/* BOTTOM STRIP */
.bottom-strip{
  position:absolute;
  bottom:0;
  width:100%;
  background:white;
  color:black;
  font-size:12px;
  display:flex;
  justify-content:space-around;
  padding:8px 0;
  font-weight:bold;
}

/* ===== CUT LINE ===== */
.cut{
  width:100%;
  max-width:360px;
  margin:20px 0;
  border-top:2px dashed #888;
  position:relative;
}

.cut::before,
.cut::after{
  content:"✂";
  position:absolute;
  top:-15px;
  font-size:20px;
}

/* ===== BACK CARD ===== */
.card-back{
  width:100%;
  max-width:360px;
  background:#0a1626;
  border-radius:20px;
  padding:15px;
  box-shadow:0 0 20px rgba(255,0,0,0.3);
}

.card-back h3{
  text-align:center;
  font-size:14px;
  margin-bottom:10px;
}

/* INFO BOX */
.info{
  background:#2c3b4d;
  border-radius:15px;
  padding:15px;
  font-size:13px;
  line-height:1.8;
}

/* RED DECOR */
.red-side{
  width:15px;
  height:80px;
  background:red;
  position:absolute;
  right:0;
  top:40%;
  border-radius:10px 0 0 10px;
}

.flag{
  position:absolute;
  bottom:10px;
  right:10px;
  font-size:20px;
}

</style>
</head>

<body>

<!-- FRONT -->
<div class="card-front">

  <div class="leaders">
    <img src="itwing.jpg">
    <img src="karunanithi.jpg">
  </div>

  <div class="qr">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=DMK-MEMBER">
  </div>

  <div class="center-logo">
    <img src="stalin.png">
  </div>

  <div class="title">திராவிட முன்னேற்றக் கழகம்</div>
  <div class="subtitle">இணைய வழி உறுப்பினர் அட்டை</div>

  <div class="red-shape"></div>

  <div class="bottom-strip">
    <div id="கடமை"></div>
    <div>|</div>
    <div id="கண்ணியம்"></div>
    <div>|</div>
    <div>கட்டுப்பாடு</div>
  </div>

</div>

<div class="cut"></div>

<!-- BACK -->
<div class="card-back">

  <h3>இணைய வழி உறுப்பினர் அட்டை</h3>

  <div class="info">
    <p><b>பெயர் :</b> <span id="name"></span></p>
    <p><b>மாநிலம் :</b> தமிழ்நாடு</p>
    <p><b>ID :</b> <span id="id"></span></p>
  </div>

  <div class="red-side"></div>
  <div class="flag">🚩</div>

</div>

<script>
document.getElementById("name").innerText = localStorage.getItem("name") || "User";
document.getElementById("district").innerText = localStorage.getItem("district") || "District";
document.getElementById("constituency").innerText = localStorage.getItem("constituency") || "Constituency";
document.getElementById("id").innerText = localStorage.getItem("id") || "DMK00000";
</script>

</body>
</html>
