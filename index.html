<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMK Joining Portal</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:url('bg.jpg') no-repeat center center/cover;
    min-height:100vh;
    color:white;
    overflow-x:hidden;
}

/* DARK OVERLAY */

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    z-index:-1;
}

/* LEADER IMAGES */

.stalin{
    position:fixed;
    left:0;
    bottom:0;
    width:35%;
    max-width:350px;
}

.udhay{
    position:fixed;
    right:0;
    bottom:0;
    width:35%;
    max-width:350px;
}

/* TOP SECTION */

.top-section{
    text-align:center;
    padding:25px 15px;
}

.logo{
    width:90px;
    margin-bottom:10px;
}

.main-title{
    font-size:60px;
    font-weight:bold;
    color:red;
}

.portal{
    font-size:20px;
    margin-top:5px;
}

.join-title{
    margin-top:30px;
    font-size:70px;
    font-weight:bold;
}

.join-title span{
    color:red;
}

.change-text{
    font-size:28px;
    margin-top:10px;
}

/* FORM */

.form-container{
    width:92%;
    max-width:720px;
    margin:20px auto;
    background:rgba(0,0,0,0.88);
    border:2px solid red;
    border-radius:20px;
    padding:30px 20px;
    box-shadow:0 0 25px rgba(255,0,0,0.5);
}

.form-title{
    text-align:center;
    color:red;
    font-size:38px;
    margin-bottom:30px;
    font-weight:bold;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.input-box{
    width:100%;
}

.input-box label{
    display:block;
    margin-bottom:10px;
    font-size:17px;
}

.input-box input,
.input-box select,
.input-box textarea{
    width:100%;
    padding:15px;
    background:#111;
    border:1px solid #444;
    border-radius:10px;
    color:white;
    font-size:16px;
}

.input-box textarea{
    resize:none;
    height:120px;
}

.full{
    grid-column:1/3;
}

/* PREVIEW */

.preview-box{
    text-align:center;
    margin-top:30px;
}

.preview-box img{
    width:150px;
    height:170px;
    border:2px solid red;
    border-radius:15px;
    object-fit:cover;
    margin-top:10px;
    background:#222;
}

/* BUTTON */

.join-btn{
    width:100%;
    padding:16px;
    margin-top:30px;
    background:red;
    border:none;
    border-radius:12px;
    color:white;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
}

.join-btn:hover{
    background:#cc0000;
}

/* FOOTER */

.footer{
    text-align:center;
    margin-top:30px;
    padding:20px;
    color:#ccc;
}

.socials{
    margin-top:15px;
}

.socials i{
    margin:0 10px;
    color:red;
    font-size:24px;
}

/* MOBILE */

@media(max-width:768px){

.form-grid{
    grid-template-columns:1fr;
}

.full{
    grid-column:1/2;
}

.main-title{
    font-size:45px;
}

.join-title{
    font-size:45px;
}

.change-text{
    font-size:18px;
}

.stalin,
.udhay{
    width:42%;
    opacity:0.8;
}

}

</style>
</head>

<body>

<!-- LEFT IMAGE -->
<img src="stalin.png" class="stalin">

<!-- RIGHT IMAGE -->
<img src="udhayanidhi.png" class="udhay">

<!-- TOP SECTION -->

<div class="top-section">

    <img src="sunrise.png" class="logo">

    <div class="main-title">DMK</div>

    <div class="portal">JOINING PORTAL</div>

    <div class="join-title">
        JOIN <span>DMK</span>
    </div>

    <div class="change-text">
        BE A PART OF CHANGE
    </div>

</div>

<!-- FORM -->

<div class="form-container">

    <div class="form-title">
        ★ MEMBERSHIP FORM ★
    </div>

    <div class="form-grid">

        <div class="input-box">
            <label>Full Name *</label>
            <input type="text" id="name"
            placeholder="Enter your full name">
        </div>

        <div class="input-box">
            <label>Mobile Number *</label>
            <input type="number" id="mobile"
            placeholder="Enter your mobile number">
        </div>

        <div class="input-box">
            <label>Email Address</label>
            <input type="email" id="email"
            placeholder="Enter your email">
        </div>

        <div class="input-box">
            <label>District *</label>

            <select id="district">

                <option>Select District</option>
                <option>Chennai</option>
                <option>Madurai</option>
                <option>Coimbatore</option>
                <option>Salem</option>
                <option>Trichy</option>

            </select>

        </div>

        <div class="input-box full">

            <label>Address *</label>

            <textarea id="address"
            placeholder="Enter your address"></textarea>

        </div>

        <div class="input-box full">

            <label>Upload Photo *</label>

            <input type="file"
            id="photoInput"
            accept="image/*">

        </div>

    </div>

    <!-- PHOTO PREVIEW -->

    <div class="preview-box">

        <h3>Photo Preview</h3>

        <img src="default-user.png"
        id="preview">

    </div>

    <!-- BUTTON -->

    <button class="join-btn"
    onclick="goToCard()">

        <i class="fa-solid fa-users"></i>

        JOIN DMK

    </button>

</div>

<!-- FOOTER -->

<div class="footer">

    © 2025 DMK Joining Portal <br><br>

    Designed with ❤️ by
    <span style="color:red;">
        Ravin Tech
    </span>

    <div class="socials">

        <i class="fab fa-facebook"></i>

        <i class="fab fa-twitter"></i>

        <i class="fab fa-instagram"></i>

        <i class="fab fa-youtube"></i>

    </div>

</div>

<script>

/* PHOTO PREVIEW */

const photoInput =
document.getElementById("photoInput");

const preview =
document.getElementById("preview");

photoInput.addEventListener("change",
function(){

    const file = this.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            preview.src = e.target.result;

        }

        reader.readAsDataURL(file);

    }

});

/* GO TO CARD PAGE */

function goToCard(){

    localStorage.setItem(
        "name",
        document.getElementById("name").value
    );

    localStorage.setItem(
        "mobile",
        document.getElementById("mobile").value
    );

    localStorage.setItem(
        "email",
        document.getElementById("email").value
    );

    localStorage.setItem(
        "district",
        document.getElementById("district").value
    );

    localStorage.setItem(
        "address",
        document.getElementById("address").value
    );

    localStorage.setItem(
        "photo",
        preview.src
    );

    /* REDIRECT */

    window.location.href = "card.html";

}

</script>

</body>
</html>
