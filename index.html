<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>udanpirappey va</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#000;
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND */

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.85)),
    url('https://images.unsplash.com/photo-1515169067868-5387ec356754?q=80&w=1974&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    z-index:-2;
}

body::after{
    content:'';
    position:fixed;
    inset:0;
    background:radial-gradient(circle at center, rgba(255,0,0,0.25), transparent 60%);
    z-index:-1;
}

/* HEADER */

.top{
    padding:25px 20px;
    text-align:center;
}

.logo{
    font-size:60px;
    font-weight:800;
    color:#ff0000;
    text-shadow:0 0 20px red;
}

.sub{
    font-size:22px;
    font-weight:600;
    letter-spacing:2px;
}

/* HERO */

.hero{
    text-align:center;
    padding:10px 15px 30px;
}

.hero h1{
    font-size:70px;
    line-height:1;
    font-weight:800;
}

.hero h1 span{
    color:red;
}

.hero p{
    margin-top:10px;
    font-size:28px;
    font-weight:600;
    color:#ddd;
}

/* LEADERS */

.leaders{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-top:20px;
    padding:0 20px;
}

.leaders img{
    width:40%;
    max-width:320px;
    border-radius:20px;
    filter:drop-shadow(0 0 25px red);
}

/* FORM */

.form-container{
    width:95%;
    max-width:800px;
    margin:20px auto 60px;
    background:rgba(0,0,0,0.75);
    border:2px solid red;
    border-radius:25px;
    padding:35px 25px;
    box-shadow:0 0 30px rgba(255,0,0,0.3);
    backdrop-filter:blur(8px);
}

.form-title{
    text-align:center;
    color:red;
    font-size:38px;
    font-weight:800;
    margin-bottom:30px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.input-box{
    display:flex;
    flex-direction:column;
}

.input-box label{
    margin-bottom:8px;
    font-weight:500;
    color:#fff;
}

.input-box input,
.input-box select,
.input-box textarea{
    background:#111;
    border:1px solid #444;
    border-radius:12px;
    padding:16px;
    color:white;
    outline:none;
    font-size:16px;
}

.input-box textarea{
    resize:none;
    height:120px;
}

.full{
    grid-column:1/3;
}

/* PHOTO */

.preview{
    width:160px;
    height:160px;
    border:2px solid red;
    border-radius:15px;
    margin:20px auto;
    overflow:hidden;
    background:#111;
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* BUTTON */

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:14px;
    background:linear-gradient(to right,#ff0000,#c40000);
    color:white;
    font-size:26px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 0 25px red;
}

/* FOOTER */

footer{
    text-align:center;
    padding:30px 20px;
    border-top:1px solid #222;
    color:#aaa;
}

footer span{
    color:red;
    font-weight:700;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
    font-size:45px;
}

.hero p{
    font-size:18px;
}

.form-grid{
    grid-template-columns:1fr;
}

.full{
    grid-column:auto;
}

.leaders{
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.leaders img{
    width:75%;
}

.logo{
    font-size:42px;
}

.form-title{
    font-size:28px;
}

}

</style>
</head>

<body>

<!-- TOP -->

<div class="top">
    <div class="logo">DMK</div>
    <div class="sub">JOINING PORTAL</div>
</div>

<!-- HERO -->

<section class="hero">

    <h1>JOIN <span>DMK</span></h1>

    <p>BE A PART OF CHANGE</p>

</section>

<!-- LEADERS -->

<div class="leaders">

    <!-- MK STALIN -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4f/M._K._Stalin.jpg">

    <!-- UDHAYANIDHI -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/8b/Udhayanidhi_Stalin.jpg">

</div>

<!-- FORM -->

<div class="form-container">

    <div class="form-title">
        MEMBERSHIP FORM
    </div>

    <form>

        <div class="form-grid">

            <div class="input-box">
                <label>Full Name *</label>
                <input type="text" placeholder="Enter your full name">
            </div>

            <div class="input-box">
                <label>Mobile Number *</label>
                <input type="number" placeholder="Enter your mobile number">
            </div>

            <div class="input-box">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="input-box">
                <label>District *</label>

                <select>

<option>Choose District</option>
<option>Chennai</option>
<option>Coimbatore</option>
<option>Madurai</option>
<option>Salem</option>
<option>Erode</option>
<option>Trichy</option>
<option>Tirunelveli</option>
<option>Thoothukudi</option>
<option>Vellore</option>
<option>Virudhunagar</option>
<option>Kanchipuram</option>
<option>Cuddalore</option>
<option>Dindigul</option>
<option>Nagapattinam</option>
<option>Namakkal</option>
<option>Karur</option>
<option>Thanjavur</option>
<option>Theni</option>
<option>Sivagangai</option>
<option>Krishnagiri</option>
<option>Ramanathapuram</option>

                </select>

            </div>

            <div class="input-box full">
                <label>Address *</label>
                <textarea placeholder="Enter your address"></textarea>
            </div>

            <div class="input-box full">
                <label>Upload Photo *</label>
                <input type="file" accept="image/*" id="photo">
            </div>

        </div>

        <!-- PREVIEW -->

        <div class="preview">
            <img id="previewImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
        </div>

        <button type="submit">
            JOIN DMK
        </button>

    </form>

</div>

<!-- FOOTER -->

<footer>

    © 2025 DMK Joining Portal <br><br>

    Designed with ❤️ by <span>Ravin Tech</span>

</footer>

<script>

/* IMAGE PREVIEW */

const photo = document.getElementById("photo");
const preview = document.getElementById("previewImg");

photo.addEventListener("change",function(){

    const file = this.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(){
            preview.src = reader.result;
        }

        reader.readAsDataURL(file);

    }

});

</script>

</body>
  </html>
