<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanyakumari Portal</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      color:#fff;
      overflow-x:hidden;
      height:100vh;
    }

    .bg{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:url('background.jpg') center/cover no-repeat;
      filter:brightness(0.35);
      z-index:-1;
    }

    header{
      text-align:center;
      padding:15px;
      background:rgba(0,0,0,0.6);
      font-size:18px;
      font-weight:bold;
    }

    .slogan{
      font-size:13px;
      color:yellow;
      margin-top:5px;
    }

    .container{
      max-width:500px;
      margin:0 auto;
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      padding:20px;
    }

    .card{
      background:rgba(0,0,0,0.75);
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 15px #000;
    }

    input, select{
      width:100%;
      padding:10px;
      margin:10px 0;
      border:none;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:12px;
      background:#e91e63;
      border:none;
      color:#fff;
      font-size:16px;
      border-radius:8px;
      cursor:pointer;
    }

    button:hover{
      background:#c2185b;
    }

    .hidden{display:none;}

    .tagline{
      margin-top:10px;
      color:yellow;
      text-align:center;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="bg"></div>

<header>
  Kanyakumari District Portal
  <div class="slogan">தமிழ்நாடு போராடும் தமிழ்நாடு வெல்லும்</div>
</header>

<!-- PAGE 1 -->
<div class="container" id="page1">
  <div class="card">
    <h2>Join / சேரவும்</h2>

    <input type="text" id="name" placeholder="Name / பெயர்" />

    <select id="constituency">
      <option value="">Select Constituency / தொகுதியை தேர்ந்தெடுக்கவும்</option>
      <option>Nagercoil</option>
      <option>Colachel</option>
      <option>Padmanabhapuram</option>
      <option>Vilavancode</option>
      <option>Killiyoor</option>
      <option>Kanyakumari</option>
    </select>

    <button onclick="goNext()">Continue / தொடரவும்</button>

    <div class="tagline">தமிழ்நாடு போராடும் தமிழ்நாடு வெல்லும்</div>
  </div>
</div>

<!-- PAGE 2 -->
<div class="container hidden" id="page2">
  <div class="card">
    <h2>Details / விவரங்கள்</h2>

    <input type="text" id="showName" placeholder="Name / பெயர்" />

    <input type="text" id="showConstituency" placeholder="Constituency / தொகுதி" readonly />

    <input type="number" id="age" placeholder="Age / வயது" />

    <input type="text" id="phone" placeholder="Phone Number / தொலைபேசி" />

    <button onclick="submitFinal()">Submit / சமர்ப்பிக்கவும்</button>

    <div class="tagline">தமிழ்நாடு போராடும் தமிழ்நாடு வெல்லும்</div>
  </div>
</div>

<script>
function goNext(){
  let name = document.getElementById("name").value;
  let constituency = document.getElementById("constituency").value;

  if(name === "" || constituency === ""){
    alert("Fill all fields / அனைத்தையும் நிரப்பவும்");
    return;
  }

  document.getElementById("page1").classList.add("hidden");
  document.getElementById("page2").classList.remove("hidden");

  document.getElementById("showName").value = name;
  document.getElementById("showConstituency").value = constituency;
}

function submitFinal(){
  alert("Submitted Successfully / வெற்றிகரமாக சமர்ப்பிக்கப்பட்டது");
}
</script>

</body>
</html>
