<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Udanpirappey Va Membership</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg, #000, #b30000);
  color:white;
  text-align:center;
}

.container{
  margin-top:40px;
}

h1{
  color:#ff1a1a;
  font-size:28px;
}

input, select{
  padding:10px;
  margin:10px;
  width:270px;
  border:none;
  border-radius:8px;
}

button{
  padding:10px 25px;
  background:black;
  color:white;
  border:1px solid red;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:red;
}

footer{
  margin-top:30px;
  font-size:14px;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="container">

<h1>UDANPIRAPPEY VA</h1>

<input type="text" id="name" placeholder="Enter Name"><br>

<!-- KANYAKUMARI CONSTITUENCIES -->
<select id="constituency">
  <option value="">Select Constituency</option>
  <option>Kanyakumari</option>
  <option>Nagercoil</option>
  <option>Colachel</option>
  <option>Padmanabhapuram</option>
  <option>Vilavancode</option>
  <option>Killiyoor</option>
</select><br>

<input type="text" id="district" placeholder="Enter District (Kanyakumari)"><br>

<input type="file" id="photo" accept="image/*"><br>

<button onclick="generateCard()">Generate Card</button>

<footer>
Created by Ravin Tech
</footer>

</div>

<script>
function generateCard(){
  const name = document.getElementById("name").value;
  const district = document.getElementById("district").value;
  const constituency = document.getElementById("constituency").value;
  const photoFile = document.getElementById("photo").files[0];

  if(!name || !district || !constituency){
    alert("Fill all fields");
    return;
  }

  const id = "RAVIN" + Math.floor(Math.random()*100000);

  function save(photo){
    localStorage.setItem("name", name);
    localStorage.setItem("district", district);
    localStorage.setItem("constituency", constituency);
    localStorage.setItem("id", id);
    localStorage.setItem("photo", photo);

    window.location.href = "card.html";
  }

  if(photoFile){
    const reader = new FileReader();
    reader.onload = e => save(e.target.result);
    reader.readAsDataURL(photoFile);
  } else {
    save("");
  }
}
</script>

</body>
</html>
