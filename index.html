<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanyakumari Portal</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      color:#fff;
      overflow-x:hidden;
    }

    /* YOUR BACKGROUND IMAGE HERE */
    .bg{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:url('background.jpg') center/cover no-repeat;
      filter:brightness(0.35);
      z-index:-1;
    }

    header{
      text-align:center;
      padding:18px;
      background:rgba(0,0,0,0.6);
      font-size:20px;
      font-weight:bold;
    }

    .container{
      max-width:500px;
      margin:40px auto;
      padding:20px;
    }

    .card{
      background:rgba(0,0,0,0.7);
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 15px #000;
    }

    input, select{
      width:100%;
      padding:10px;
      margin:10px 0;
      border:none;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:12px;
      background:#e91e63;
      border:none;
      color:#fff;
      font-size:16px;
      border-radius:8px;
      cursor:pointer;
    }

    button:hover{
      background:#c2185b;
    }

    .hidden{display:none;}

    ul{
      margin-top:10px;
      padding-left:20px;
      max-height:250px;
      overflow:auto;
    }

    .tagline{
      margin-top:10px;
      color:yellow;
      text-align:center;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="bg"></div>

<header>
  Kanyakumari District Portal
</header>

<!-- PAGE 1 -->
<div class="container" id="page1">
  <div class="card">
    <h2>Join Kanyakumari Portal</h2>

    <input type="text" id="name" placeholder="Your Name" />
    <input type="number" id="age" placeholder="Age" />

    <button onclick="submitForm()">Submit</button>

    <div class="tagline">தமிழ்நாடு வாழ்க</div>
  </div>
</div>

<!-- PAGE 2 -->
<div class="container hidden" id="page2">
  <div class="card">
    <h2>Welcome</h2>

    <h3 id="showName"></h3>

    <h4>Kanyakumari Constituencies</h4>
    <ul>
      <li>Nagercoil</li>
      <li>Colachel</li>
      <li>Padmanabhapuram</li>
      <li>Vilavancode</li>
      <li>Killiyoor</li>
      <li>Kanyakumari</li>
    </ul>

    <div class="tagline">தமிழ்நாடு வாழ்க</div>
  </div>
</div>

<script>
function submitForm(){
  let name = document.getElementById("name").value;

  if(name === ""){
    alert("Enter your name");
    return;
  }

  document.getElementById("page1").classList.add("hidden");
  document.getElementById("page2").classList.remove("hidden");

  document.getElementById("showName").innerText = name;
}
</script>

</body>
</html>
