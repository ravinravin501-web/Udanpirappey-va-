<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMK Joining Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
overflow-x:hidden;
color:#fff;
}

/* BACKGROUND */

body::before{
content:'';
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:
linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.88)),
url('https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=1974&auto=format&fit=crop');
background-size:cover;
background-position:center;
z-index:-3;
}

body::after{
content:'';
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:radial-gradient(circle,rgba(255,0,0,.25),transparent 70%);
z-index:-2;
}

/* HERO */

.hero{
position:relative;
padding:30px 15px 10px;
text-align:center;
}

.logo{
font-size:75px;
font-weight:800;
color:#ff0000;
text-shadow:0 0 20px red;
line-height:1;
}

.portal{
font-size:24px;
font-weight:600;
letter-spacing:3px;
}

.quote{
margin-top:15px;
font-size:18px;
color:#ddd;
}

.main-title{
margin-top:25px;
font-size:90px;
font-weight:900;
line-height:1;
text-transform:uppercase;
}

.main-title span{
color:red;
}

.sub-title{
font-size:45px;
font-weight:700;
margin-top:10px;
color:#f2f2f2;
}

/* LEADERS */

.leaders{
position:relative;
display:flex;
justify-content:space-between;
align-items:flex-end;
padding:0 10px;
margin-top:10px;
}

.leaders img{
width:36%;
max-width:380px;
filter:drop-shadow(0 0 30px red);
}

/* FORM BOX */

.form-box{
width:95%;
max-width:820px;
margin:-30px auto 50px;
background:rgba(0,0,0,.78);
border:2px solid #ff0000;
border-radius:25px;
padding:35px 25px;
backdrop-filter:blur(8px);
box-shadow:0 0 30px rgba(255,0,0,.35);
position:relative;
z-index:5;
}

.form-title{
text-align:center;
font-size:40px;
font-weight:800;
color:#ff0000;
margin-bottom:35px;
text-transform:uppercase;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
}

.input-group{
display:flex;
flex-direction:column;
}

.input-group label{
margin-bottom:10px;
font-size:18px;
font-weight:500;
}

.input-group input,
.input-group textarea,
.input-group select{
background:#0f0f0f;
border:1px solid #444;
border-radius:12px;
padding:16px;
font-size:17px;
color:#fff;
outline:none;
}

.input-group textarea{
height:120px;
resize:none;
}

.full{
grid-column:1/3;
}

.preview-title{
text-align:center;
margin-top:20px;
font-size:20px;
}

.preview{
width:170px;
height:170px;
margin:20px auto;
border:2px solid red;
border-radius:18px;
overflow:hidden;
background:#111;
}

.preview img{
width:100%;
height:100%;
object-fit:cover;
}

.join-btn{
width:100%;
padding:18px;
border:none;
border-radius:15px;
background:linear-gradient(to right,#ff0000,#b80000);
font-size:30px;
font-weight:700;
color:#fff;
cursor:pointer;
margin-top:15px;
transition:.3s;
}

.join-btn:hover{
transform:scale(1.02);
box-shadow:0 0 25px red;
}

/* CARD */

.member-card{
display:none;
margin-top:40px;
}

.card-box{
background:linear-gradient(135deg,#111,#1b0000);
border:2px solid red;
border-radius:25px;
padding:25px;
box-shadow:0 0 30px rgba(255,0,0,.4);
text-align:center;
}

.card-box h2{
font-size:38px;
color:red;
margin-bottom:20px;
}

.card-photo{
width:130px;
height:130px;
border-radius:15px;
border:2px solid red;
object-fit:cover;
margin-bottom:20px;
}

.card-name{
font-size:32px;
font-weight:700;
}

.card-details{
margin-top:10px;
font-size:18px;
}

.card-status{
margin-top:25px;
font-size:20px;
color:#ff4d4d;
font-weight:700;
}

/* FOOTER */

footer{
padding:25px;
text-align:center;
font-size:18px;
color:#ccc;
border-top:1px solid #222;
}

footer span{
color:red;
font-weight:700;
}

/* MOBILE */

@media(max-width:768px){

.main-title{
font-size:52px;
}

.sub-title{
font-size:24px;
}

.form-grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.leaders{
flex-direction:row;
justify-content:space-between;
}

.leaders img{
width:45%;
}

.logo{
font-size:50px;
}

.form-title{
font-size:28px;
}

}

</style>
</head>

<body>

<!-- HERO -->

<section class="hero">

<div class="logo">DMK</div>

<div class="portal">JOINING PORTAL</div>

<div class="quote">
“ நாம் தொடங்கியது முடியாத பயணம்... ”
</div>

<div class="main-title">
JOIN <span>DMK</span>
</div>

<div class="sub-title">
BE A PART OF CHANGE
</div>

</section>

<!-- LEADERS -->

<div class="leaders">

<img src="https://upload.wikimedia.org/wikipedia/commons/4/4f/M._K._Stalin.jpg">

<img src="https://upload.wikimedia.org/wikipedia/commons/8/8b/Udhayanidhi_Stalin.jpg">

</div>

<!-- FORM -->

<div class="form-box">

<div class="form-title">
★ Membership Form ★
</div>

<form id="joinForm">

<div class="form-grid">

<div class="input-group">
<label>Full Name *</label>
<input type="text" id="name" placeholder="Enter your full name" required>
</div>

<div class="input-group">
<label>Mobile Number *</label>
<input type="number" id="mobile" placeholder="Enter your mobile number" required>
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" placeholder="Enter your email">
</div>

<div class="input-group">
<label>District *</label>

<select id="district" required>

<option>Select District</option>

<option>Ariyalur</option>
<option>Chengalpattu</option>
<option>Chennai</option>
<option>Coimbatore</option>
<option>Cuddalore</option>
<option>Dharmapuri</option>
<option>Dindigul</option>
<option>Erode</option>
<option>Kallakurichi</option>
<option>Kancheepuram</option>
<option>Kanniyakumari</option>
<option>Karur</option>
<option>Krishnagiri</option>
<option>Madurai</option>
<option>Mayiladuthurai</option>
<option>Nagapattinam</option>
<option>Namakkal</option>
<option>Nilgiris</option>
<option>Perambalur</option>
<option>Pudukkottai</option>
<option>Ramanathapuram</option>
<option>Ranipet</option>
<option>Salem</option>
<option>Sivaganga</option>
<option>Tenkasi</option>
<option>Thanjavur</option>
<option>Theni</option>
<option>Thoothukudi</option>
<option>Tiruchirappalli</option>
<option>Tirunelveli</option>
<option>Tirupathur</option>
<option>Tiruppur</option>
<option>Tiruvallur</option>
<option>Tiruvannamalai</option>
<option>Tiruvarur</option>
<option>Vellore</option>
<option>Viluppuram</option>
<option>Virudhunagar</option>

</select>

</div>

<div class="input-group full">
<label>Address *</label>
<textarea placeholder="Enter your address"></textarea>
</div>

<div class="input-group full">
<label>Upload Photo *</label>
<input type="file" id="photo" accept="image/*" required>
</div>

</div>

<div class="preview-title">
Photo Preview
</div>

<div class="preview">
<img id="previewImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
</div>

<button type="submit" class="join-btn">
JOIN DMK
</button>

</form>

<!-- MEMBER CARD -->

<div class="member-card" id="memberCard">

<div class="card-box">

<h2>DMK MEMBERSHIP CARD</h2>

<img id="cardPhoto" class="card-photo" src="">

<div id="cardName" class="card-name"></div>

<div id="cardMobile" class="card-details"></div>

<div id="cardDistrict" class="card-details"></div>

<div class="card-status">
Official DMK Member
</div>

</div>

</div>

</div>

<!-- FOOTER -->

<footer>

© 2025 DMK Joining Portal <br><br>

Designed with ❤️ by <span>Ravin Tech</span>

</footer>

<script>

/* IMAGE PREVIEW */

const photo = document.getElementById('photo');
const preview = document.getElementById('previewImg');

photo.addEventListener('change',function(){

const file = this.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

preview.src = e.target.result;

}

reader.readAsDataURL(file);

}

});

/* FORM SUBMIT */

const form = document.getElementById("joinForm");

form.addEventListener("submit",function(e){

e.preventDefault();

/* GET VALUES */

const name = document.getElementById("name").value;

const mobile = document.getElementById("mobile").value;

const district = document.getElementById("district").value;

/* SHOW CARD */

document.getElementById("memberCard").style.display = "block";

document.getElementById("cardName").innerHTML = name;

document.getElementById("cardMobile").innerHTML =
"Mobile : " + mobile;

document.getElementById("cardDistrict").innerHTML =
"District : " + district;

document.getElementById("cardPhoto").src =
preview.src;

/* SCROLL */

document.getElementById("memberCard")
.scrollIntoView({
behavior:"smooth"
});

});

</script>

</body>
  </html>
