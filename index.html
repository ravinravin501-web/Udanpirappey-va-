<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udanpirappey Va</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg, #000, #b30000);
  color:white;
  text-align:center;
}

.container{
  padding:15px;
}

h1{
  color:#ff1a1a;
  font-size:24px;
}

.leaders{
  display:flex;
  justify-content:center;
  gap:15px;
  margin:15px 0;
  flex-wrap:wrap;
}

.leaders img{
  width:120px;
  height:140px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid red;
}

input, select{
  width:90%;
  max-width:300px;
  padding:10px;
  margin:8px;
  border:none;
  border-radius:8px;
}

button{
  width:90%;
  max-width:300px;
  padding:10px;
  background:black;
  color:white;
  border:1px solid red;
  border-radius:8px;
}

button:hover{
  background:red;
}

footer{
  margin-top:20px;
  font-size:12px;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="container">

<h1>UDANPIRAPPEY VA</h1>

<!-- LEADERS -->
<div class="leaders">
  <div>
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/M._K._Stalin.jpg">
    <p>:contentReference[oaicite:2]{index=2}</p>
  </div>

  <div>
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Karunanidhi_2010.jpg">
    <p>:contentReference[oaicite:3]{index=3}</p>
  </div>
</div>

<!-- FORM -->
<input type="text" id="name" placeholder="Enter Name"><br>

<select id="constituency">
  <option>Select Constituency (Kanyakumari)</option>
  <option>Kanyakumari</option>
  <option>Nagercoil</option>
  <option>Colachel</option>
  <option>Padmanabhapuram</option>
  <option>Vilavancode</option>
  <option>Killiyoor</option>
</select><br>

<input type="text" id="district" placeholder="District"><br>

<input type="file" id="photo"><br>

<button onclick="generateCard()">Generate Card</button>

<footer>
Created by Ravin Tech
</footer>

</div>

<script>
function generateCard(){
  const name = document.getElementById("name").value;
  const district = document.getElementById("district").value;
  const constituency = document.getElementById("constituency").value;
  const file = document.getElementById("photo").files[0];

  if(!name || !district || !constituency){
    alert("Fill all fields");
    return;
  }

  const id = "RAVIN" + Math.floor(Math.random()*99999);

  function save(photo){
    localStorage.setItem("name", name);
    localStorage.setItem("district", district);
    localStorage.setItem("constituency", constituency);
    localStorage.setItem("id", id);
    localStorage.setItem("photo", photo);

    window.location.href = "card.html";
  }

  if(file){
    const reader = new FileReader();
    reader.onload = e => save(e.target.result);
    reader.readAsDataURL(file);
  } else {
    save("");
  }
}
</script>

</body>
</html>
