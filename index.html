<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMK Joining Portal</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:url('bg.jpg') no-repeat center center/cover;
    min-height:100vh;
    color:white;
    overflow-x:hidden;
}

/* DARK OVERLAY */
body::before{
    content:'';
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
    z-index:-1;
}

/* HEADER */

.top-section{
    text-align:center;
    padding:30px 15px 10px;
}

.logo{
    width:90px;
    margin-bottom:10px;
}

.main-title{
    font-size:58px;
    font-weight:bold;
    color:#ff0000;
}

.sub-title{
    font-size:18px;
    margin-top:5px;
    color:#fff;
}

.join-text{
    margin-top:30px;
    font-size:70px;
    font-weight:bold;
    text-transform:uppercase;
}

.join-text span{
    color:red;
}

.change-text{
    font-size:30px;
    margin-top:5px;
    letter-spacing:2px;
}

/* LEADER IMAGES */

.stalin{
    position:fixed;
    left:0;
    bottom:0;
    width:34%;
    max-width:350px;
}

.udhay{
    position:fixed;
    right:0;
    bottom:0;
    width:34%;
    max-width:350px;
}

/* FORM */

.form-container{
    width:90%;
    max-width:700px;
    margin:40px auto;
    background:rgba(0,0,0,0.88);
    border:2px solid red;
    border-radius:20px;
    padding:30px 25px;
    box-shadow:0 0 25px rgba(255,0,0,0.4);
}

.form-title{
    text-align:center;
    color:red;
    font-size:40px;
    margin-bottom:30px;
    font-weight:bold;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.input-box{
    width:100%;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    color:white;
    font-size:17px;
}

.input-box input,
.input-box select,
.input-box textarea{
    width:100%;
    padding:14px;
    border:1px solid #444;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
}

.input-box textarea{
    resize:none;
    height:120px;
}

.full{
    grid-column:1/3;
}

/* PHOTO PREVIEW */

.preview-box{
    text-align:center;
    margin-top:20px;
}

.preview-box img{
    width:150px;
    height:170px;
    border:2px solid red;
    border-radius:12px;
    object-fit:cover;
    margin-top:10px;
    background:#222;
}

/* BUTTON */

.join-btn{
    width:100%;
    padding:16px;
    background:red;
    border:none;
    border-radius:12px;
    color:white;
    font-size:26px;
    font-weight:bold;
    margin-top:30px;
    cursor:pointer;
}

.join-btn:hover{
    background:#cc0000;
}

/* FOOTER */

.footer{
    text-align:center;
    margin-top:30px;
    padding:20px;
    color:#ccc;
}

.socials{
    margin-top:15px;
}

.socials i{
    margin:0 10px;
    font-size:24px;
    color:red;
}

/* MOBILE */

@media(max-width:768px){

.form-grid{
    grid-template-columns:1fr;
}

.full{
    grid-column:1/2;
}

.main-title{
    font-size:42px;
}

.join-text{
    font-size:45px;
}

.change-text{
    font-size:20px;
}

.stalin,
.udhay{
    width:45%;
    opacity:0.8;
}

}

</style>
</head>

<body>

<!-- LEFT LEADER -->
<img src="stalin.png" class="stalin">

<!-- RIGHT LEADER -->
<img src="udhayanidhi.png" class="udhay">

<div class="top-section">

    <!-- SUNRISE LOGO -->
    <img src="sunrise.png" class="logo">

    <div class="main-title">DMK</div>

    <div class="sub-title">JOINING PORTAL</div>

    <div class="join-text">
        JOIN <span>DMK</span>
    </div>

    <div class="change-text">
        BE A PART OF CHANGE
    </div>

</div>

<!-- FORM -->

<div class="form-container">

    <div class="form-title">
        ★ MEMBERSHIP FORM ★
    </div>

    <div class="form-grid">

        <div class="input-box">
            <label>Full Name *</label>
            <input type="text" placeholder="Enter your full name">
        </div>

        <div class="input-box">
            <label>Mobile Number *</label>
            <input type="number" placeholder="Enter your mobile number">
        </div>

        <div class="input-box">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email">
        </div>

        <div class="input-box">
            <label>District *</label>

            <select>
                <option>Select District</option>
                <option>Chennai</option>
                <option>Coimbatore</option>
                <option>Madurai</option>
                <option>Salem</option>
                <option>Trichy</option>
            </select>
        </div>

        <div class="input-box full">
            <label>Address *</label>
            <textarea placeholder="Enter your address"></textarea>
        </div>

        <div class="input-box full">
            <label>Upload Photo *</label>
            <input type="file" accept="image/*" id="photoInput">
        </div>

    </div>

    <!-- PHOTO PREVIEW -->

    <div class="preview-box">

        <h3>Photo Preview</h3>

        <img id="preview" src="default-user.png">

    </div>

    <button class="join-btn">
        <i class="fa-solid fa-users"></i> JOIN DMK
    </button>

</div>

<!-- FOOTER -->

<div class="footer">

    © 2025 DMK Joining Portal <br><br>

    Designed with ❤️ by <span style="color:red;">Ravin Tech</span>

    <div class="socials">
        <i class="fab fa-facebook"></i>
        <i class="fab fa-twitter"></i>
        <i class="fab fa-instagram"></i>
        <i class="fab fa-youtube"></i>
    </div>

</div>

<script>

const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");

photoInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){
            preview.src = e.target.result;
        }

        reader.readAsDataURL(file);
    }

});

</script>

</body>
  </html>
