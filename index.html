<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMK Membership Join</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    text-align:center;

    background:
    linear-gradient(rgba(0,0,0,0.6),
    rgba(0,0,0,0.6)),

    url('https://wallpaperaccess.com/full/6269063.jpg');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    min-height:100vh;
}

/* LEADER IMAGES */

.leaders img{
    position:fixed;
    bottom:0;
    z-index:-1;
    opacity:0.25;
}

.leader-left{
    left:0;
    width:180px;
}

.leader-right{
    right:0;
    width:180px;
}

/* FORM BOX */

.form-box{
    background:rgba(0,0,0,0.7);
    padding:25px;
    border-radius:25px;
    max-width:400px;
    margin:auto;
    margin-top:40px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.logo{
    width:120px;
    margin-bottom:15px;
}

h1{
    color:white;
    font-size:28px;
    margin-bottom:20px;
}

input{
    width:90%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:15px;
    font-size:16px;
    outline:none;
}

button{
    background:red;
    color:white;
    border:none;
    padding:15px 45px;
    border-radius:40px;
    margin-top:25px;
    font-size:20px;
    cursor:pointer;
    width:90%;
}

button:hover{
    background:#cc0000;
}

</style>
</head>

<body>

<!-- LEADER IMAGES -->

<div class="leaders">

<img src="https://upload.wikimedia.org/wikipedia/commons/5/55/M._K._Stalin.jpg"
class="leader-left">

<img src="https://upload.wikimedia.org/wikipedia/commons/5/5b/Udhayanidhi_Stalin.jpg"
class="leader-right">

</div>

<!-- FORM SECTION -->

<div class="form-box">

<img src="https://upload.wikimedia.org/wikipedia/en/5/5f/Dravida_Munnetra_Kazhagam_logo.png"
class="logo">

<h1>DMK Membership Join</h1>

<input type="text"
id="name"
placeholder="பெயர்">

<input type="text"
id="father"
placeholder="தந்தை / கணவர் பெயர்">

<input type="number"
id="age"
placeholder="வயது">

<input type="text"
id="district"
placeholder="மாவட்டம்">

<input type="text"
id="constituency"
placeholder="சட்டமன்றத் தொகுதி">

<input type="file"
id="photo">

<br>

<button onclick="goToCard()">
Join Now
</button>

</div>

<script>

function goToCard(){

localStorage.setItem(
"name",
document.getElementById("name").value
);

localStorage.setItem(
"father",
document.getElementById("father").value
);

localStorage.setItem(
"age",
document.getElementById("age").value
);

localStorage.setItem(
"district",
document.getElementById("district").value
);

localStorage.setItem(
"constituency",
document.getElementById("constituency").value
);

let file =
document.getElementById("photo").files[0];

if(file){

let reader = new FileReader();

reader.onload = function(e){

localStorage.setItem(
"photo",
e.target.result
);

window.location.href = "page2.html";

}

reader.readAsDataURL(file);

}else{

window.location.href = "page2.html";

}

}

</script>

</body>
</html>
