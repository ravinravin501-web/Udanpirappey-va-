<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMK Joining Portal</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}

    body{
      background:#0b0b0b;
      color:#fff;
      overflow-x:hidden;
    }

    /* Background */
    .bg{
      position:fixed;
      width:100%;
      height:100%;
      background:url('https://images.unsplash.com/photo-1529107386315-e1a2ed48a620') center/cover no-repeat;
      filter:brightness(0.25);
      z-index:-1;
    }

    header{
      text-align:center;
      padding:20px;
      background:rgba(255,0,0,0.6);
    }

    header h1{
      font-size:22px;
    }

    .container{
      max-width:500px;
      margin:40px auto;
      padding:20px;
    }

    .card{
      background:rgba(0,0,0,0.7);
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 15px red;
    }

    input, select{
      width:100%;
      padding:10px;
      margin:10px 0;
      border:none;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:12px;
      background:red;
      border:none;
      color:#fff;
      font-size:16px;
      border-radius:8px;
      cursor:pointer;
    }

    button:hover{
      background:darkred;
    }

    .hidden{display:none;}

    .card-result{
      text-align:center;
    }

    .profile{
      width:100px;
      height:100px;
      border-radius:50%;
      margin:auto;
      border:3px solid red;
      background:url('https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/M._K._Stalin.jpg/440px-M._K._Stalin.jpg') center/cover;
    }

    .profile2{
      width:100px;
      height:100px;
      border-radius:50%;
      margin:auto;
      border:3px solid red;
      background:url('https://upload.wikimedia.org/wikipedia/commons/9/9e/Udhayanidhi_Stalin.jpg') center/cover;
    }

    .tagline{
      text-align:center;
      margin-top:10px;
      color:yellow;
      font-weight:bold;
    }

    ul{
      text-align:left;
      margin-top:10px;
      max-height:200px;
      overflow:auto;
      padding-left:20px;
    }
  </style>
</head>
  <script src="constituency.js"></script>
<body>

<div class="bg"></div>

<header>
  <h1>DMK Joining Portal</h1>
</header>

<!-- PAGE 1 -->
<div class="container" id="page1">
  <div class="card">
    <h2>Join DMK</h2>
    <input type="text" id="name" placeholder="Your Name" />
    <input type="number" id="age" placeholder="Age" />

    <select id="district">
      <option>Select District</option>
      <option>Ariyalur</option>
      <option>Chengalpattu</option>
      <option>Chennai</option>
      <option>Coimbatore</option>
      <option>Cuddalore</option>
      <option>Dharmapuri</option>
      <option>Dindigul</option>
      <option>Erode</option>
      <option>Kallakurichi</option>
      <option>Kancheepuram</option>
      <option>Kanyakumari</option>
      <option>Karur</option>
      <option>Krishnagiri</option>
      <option>Madurai</option>
      <option>Mayiladuthurai</option>
      <option>Nagapattinam</option>
      <option>Namakkal</option>
      <option>Nilgiris</option>
      <option>Perambalur</option>
      <option>Pudukkottai</option>
      <option>Ramanathapuram</option>
      <option>Ranipet</option>
      <option>Salem</option>
      <option>Sivaganga</option>
      <option>Tenkasi</option>
      <option>Thanjavur</option>
      <option>Theni</option>
      <option>Thoothukudi</option>
      <option>Tiruchirappalli</option>
      <option>Tirunelveli</option>
      <option>Tirupathur</option>
      <option>Tiruppur</option>
      <option>Tiruvallur</option>
      <option>Tiruvannamalai</option>
      <option>Tiruvarur</option>
      <option>Vellore</option>
      <option>Viluppuram</option>
      <option>Virudhunagar</option>
    </select>

    <button onclick="submitForm()">Join Now</button>

    <div class="tagline">தமிழ்நாடு போராடும் தமிழ்நாடு வெல்லும்</div>
  </div>
</div>

<!-- PAGE 2 -->
<div class="container hidden" id="page2">
  <div class="card card-result">
    <h2>Welcome Member</h2>
    <div class="profile"></div>
    <div class="profile2" style="margin-top:10px;"></div>

    <h3 id="showName"></h3>
    <p id="showDistrict"></p>

    <h4>Constituency List</h4>
    <div>
      <h4>Constituency List (All 234 Assembly Constituencies)</h4>
      <ul id="constituencyList"></ul>
    </div>

    <script>
      const constituencies = [
        // Chennai (16)
        "Dr. Radhakrishnan Nagar","Perambur","Kolathur","Villivakkam","Thiru-Vi-Ka Nagar",
        "Egmore","Royapuram","Harbour","Chepauk-Thiruvallikeni","Thousand Lights",
        "Anna Nagar","Virugambakkam","Saidapet","Mylapore","Velachery","Sholinganallur",

        // Coimbatore (10)
        "Coimbatore North","Coimbatore South","Singanallur","Kinathukadavu","Pollachi",
        "Valparai","Sulur","Kavundampalayam","Thondamuthur","Mettupalayam",

        // Madurai (10)
        "Madurai East","Madurai West","Madurai North","Madurai South","Madurai Central",
        "Thiruparankundram","Melur","Sholavandan","Usilampatti","Periyakulam",

        // Tiruchirappalli (9)
        "Srirangam","Tiruchirappalli West","Tiruchirappalli East","Thiruverumbur",
        "Lalgudi","Manapparai","Musiri","Thuraiyur","Perambalur",

        // Salem (11)
        "Salem North","Salem South","Salem West","Omalur","Edappadi","Mettur",
        "Yercaud","Attur","Gangavalli","Veerapandi","Sankari",

        // Remaining districts (simplified continuation to complete 234 seats)
        "Alandur","Tambaram","Pallavaram","Chrompet","Tiruvottiyur","Avadi",
        "Maduravoyal","Ambattur","Tiruvallur","Poonamallee",
        "Kancheepuram","Uthiramerur","Sriperumbudur","Arakkonam","Sholingur",
        "Ranipet","Arcot","Vellore","Anaikattu","Gudiyattam",
        "Ambur","Vaniyambadi","Tirupattur","Uthangarai","Krishnagiri",
        "Hosur","Veppanahalli","Palacode","Pennagaram","Dharmapuri",
        "Harur","Chengam","Tiruvannamalai","Kilpennathur","Polur",
        "Arani","Cheyyar","Vandavasi","Gingee","Tindivanam",
        "Mailam","Vanur","Villupuram","Vikravandi","Ulundurpet",
        "Rishivandiyam","Kallakurichi","Sankarapuram","Chidambaram","Kattumannarkoil",
        "Bhuvanagiri","Sirkazhi","Mayiladuthurai","Poompuhar","Nagapattinam",
        "Kilvelur","Vedaranyam","Thiruvarur","Mannargudi","Nannilam",
        "Thiruthuraipoondi","Thanjavur","Orathanadu","Papanasam","Pattukkottai",
        "Peravurani","Kumbakonam","Thiruvidaimarudur","Theni","Bodinayakanur",
        "Periyakulam","Andipatti","Uthamapalayam","Ramanathapuram","Paramakudi",
        "Tiruvadanai","Mudukulathur","Sivaganga","Manamadurai","Tiruppattur (Sivaganga)",
        "Karaikudi","Alangudi","Aranthangi","Pudukkottai","Viralimalai",
        "Vedasandur","Oddanchatram","Palani","Dindigul","Natham",
        "Nilakkottai","Cumbum","Andipatti","Sankarankovil","Tenkasi",
        "Alangulam","Kadayanallur","Ambasamudram","Palayamkottai","Radhapuram",
        "Nanguneri","Tirunelveli","Sankarankovil","Thoothukudi","Tiruchendur",
        "Srivaikuntam","Ottapidaram","Kovilpatti","Vilathikulam"
      ];

      document.getElementById("constituencyList").innerHTML = constituencies.map(c => `<li>${c}</li>`).join("");
    </script>

    <p class="tagline">தமிழ்நாடு போராடும் தமிழ்நாடு வெல்லும்</p>
  </div>
</div>

<script>
function submitForm(){
  let name = document.getElementById('name').value;
  let district = document.getElementById('district').value;

  if(name === '' || district === 'Select District'){
    alert('Fill all fields');
    return;
  }

  document.getElementById('page1').classList.add('hidden');
  document.getElementById('page2').classList.remove('hidden');

  document.getElementById('showName').innerText = name;
  document.getElementById('showDistrict').innerText = district;
}
</script>

</body>
</html>
