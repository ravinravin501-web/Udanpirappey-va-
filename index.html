<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udanpirappey Va</title>

<style>
body{
  margin:0;
  font-family: Arial;
  color:white;
  text-align:center;

  /* STALIN BACKGROUND (PUT YOUR IMAGE NAME HERE) */
  background: url("stalin.jpg") no-repeat center center/cover;
  position: relative;
}

/* DARK OVERLAY */
body::before{
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.7);
}

.container{
  position:relative;
  padding:20px;
  z-index:1;
}

h1{
  color:#ff1a1a;
  font-size:24px;
}

input, select{
  width:90%;
  max-width:300px;
  padding:10px;
  margin:8px;
  border:none;
  border-radius:8px;
}

button{
  width:90%;
  max-width:300px;
  padding:10px;
  background:black;
  color:white;
  border:1px solid red;
  border-radius:8px;
}

button:hover{
  background:red;
}

/* PHOTO PREVIEW */
.preview{
  width:100px;
  height:100px;
  border-radius:50%;
  border:2px solid red;
  object-fit:cover;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>UDANPIRAPPEY VA</h1>

<input type="text" id="name" placeholder="Enter Name"><br>

<select id="constituency">
  <option>Select Kanyakumari Constituency</option>
  <option>Kanyakumari</option>
  <option>Nagercoil</option>
  <option>Colachel</option>
  <option>Padmanabhapuram</option>
  <option>Vilavancode</option>
  <option>Killiyoor</option>
</select><br>

<input type="text" id="district" placeholder="District"><br>

<input type="file" id="photo" accept="image/*" onchange="previewImage(event)"><br>

<img id="preview" class="preview" style="display:none;"><br>

<button onclick="generateCard()">Generate Card</button>

</div>

<script>
function previewImage(event){
  const file = event.target.files[0];
  const reader = new FileReader();

  reader.onload = function(){
    const img = document.getElementById("preview");
    img.src = reader.result;
    img.style.display = "block";
  }

  if(file){
    reader.readAsDataURL(file);
  }
}

function generateCard(){
  const name = document.getElementById("name").value;
  const district = document.getElementById("district").value;
  const constituency = document.getElementById("constituency").value;
  const photoFile = document.getElementById("photo").files[0];

  if(!name || !district || !constituency){
    alert("Fill all fields");
    return;
  }

  const id = "DMK" + Math.floor(Math.random()*99999);

  const reader = new FileReader();

  reader.onload = function(e){

    localStorage.setItem("name", name);
    localStorage.setItem("district", district);
    localStorage.setItem("constituency", constituency);
    localStorage.setItem("id", id);
    localStorage.setItem("photo", e.target.result);

    window.location.href = "card.html";
  }

  if(photoFile){
    reader.readAsDataURL(photoFile);
  } else {
    localStorage.setItem("photo", "");
    window.location.href = "card.html";
  }
}
</script>

</body>
</html>
